<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="title desc">
  <title id="title">Butt Pad</title>
  <desc id="desc">An 80s neon style Butt Pad wordmark with a transparent background.</desc>
  <defs>
    <linearGradient id="sunset" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff06a" />
      <stop offset="0.25" stop-color="#ff9a3d" />
      <stop offset="0.5" stop-color="#ff3f9d" />
      <stop offset="0.75" stop-color="#7b4cf4" />
      <stop offset="1" stop-color="#27d7ff" />
    </linearGradient>
    <linearGradient id="stripe" x1="0" x2="1">
      <stop offset="0" stop-color="#27d7ff" />
      <stop offset="0.5" stop-color="#ff3f9d" />
      <stop offset="1" stop-color="#fff06a" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-25%" width="120%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feColorMatrix
        in="blur"
        type="matrix"
        values="1 0 0 0 0.9  0 1 0 0 0.1  0 0 1 0 0.7  0 0 0 0.85 0"
        result="pink-glow"
      />
      <feMerge>
        <feMergeNode in="pink-glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g fill="none" stroke-linecap="round">
    <path d="M78 165 C170 120 268 115 358 150 S548 192 672 126" stroke="#27d7ff" stroke-width="12" opacity="0.72" />
    <path d="M92 186 C190 146 284 145 365 174 S552 210 688 152" stroke="#ff3f9d" stroke-width="8" opacity="0.82" />
    <path d="M116 205 H676" stroke="url(#stripe)" stroke-width="8" opacity="0.9" />
  </g>
  <g filter="url(#glow)">
    <text
      x="380"
      y="128"
      text-anchor="middle"
      fill="#222033"
      stroke="#222033"
      stroke-width="16"
      paint-order="stroke"
      font-family="Impact, 'Arial Black', sans-serif"
      font-size="112"
      font-style="italic"
      font-weight="900"
      letter-spacing="1"
    >Butt Pad</text>
    <text
      x="380"
      y="128"
      text-anchor="middle"
      fill="url(#sunset)"
      stroke="#fff8d8"
      stroke-width="5"
      paint-order="stroke"
      font-family="Impact, 'Arial Black', sans-serif"
      font-size="112"
      font-style="italic"
      font-weight="900"
      letter-spacing="1"
    >Butt Pad</text>
    <text
      x="382"
      y="154"
      text-anchor="middle"
      fill="#27d7ff"
      opacity="0.78"
      font-family="Impact, 'Arial Black', sans-serif"
      font-size="46"
      font-style="italic"
      font-weight="900"
      letter-spacing="10"
    >SAFETY SHORTS</text>
  </g>
</svg>
